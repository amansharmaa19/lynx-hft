name: Lynx HFT CI

on:
  pull request:
    branches:
      - main
  
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libgtest-dev
      
      - name: Configure
        run: |
          cmake -S . -B build -G Nija \
          -DCMAKE_BUILD_TYPE=Release
        
      - name: Build
        run: |
          cmake --build build

      - name: Run tests
        run: |
          ctest \
            --test-dir build \
            --output-on-failure